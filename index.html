<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spoken English Task</title>
  <style>
    body { font-family: Georgia, serif; background: #f5f2ee; color: #1a1714; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; margin: 0; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; width: 100%; max-width: 540px; padding: 2.5rem 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 1.6rem; font-weight: normal; margin: 0 0 0.4rem; text-align: center; }
    .subtitle { color: #666; font-style: italic; text-align: center; margin-bottom: 1.5rem; }
    .info-box { background: #e8f0eb; border: 1px solid #b0cbb8; border-radius: 6px; padding: 1rem 1.2rem; margin-bottom: 1.5rem; font-size: 0.97rem; line-height: 1.6; }
    .status-area { text-align: center; padding: 1.5rem 0; }
    .orb { width: 64px; height: 64px; border-radius: 50%; background: #ccc; margin: 0 auto 0.8rem; transition: background 0.3s; }
    .orb.connecting { background: #aaa; }
    .orb.listening  { background: #2d5a3d; }
    .orb.speaking   { background: #4a7c6f; }
    .orb.error      { background: #8b3a2a; }
    .status-text { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: #666; }
    .transcript-box { border: 1px solid #ddd; border-radius: 6px; background: #fafaf8; min-height: 90px; max-height: 200px; overflow-y: auto; padding: 0.8rem 1rem; margin-bottom: 1.2rem; font-size: 0.95rem; line-height: 1.5; color: #555; font-style: italic; }
    .turn { margin-bottom: 0.6rem; font-style: normal; }
    .turn .who { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin-bottom: 0.15rem; }
    .turn.ai .who { color: #2d5a3d; }
    .btn-row { display: flex; gap: 0.75rem; }
    button { flex: 1; padding: 0.8rem; border: none; border-radius: 6px; font-size: 1rem; font-family: Georgia, serif; cursor: pointer; }
    #btn-start { background: #2d5a3d; color: #fff; }
    #btn-start:hover { background: #1e3d2a; }
    #btn-start:disabled { background: #999; cursor: not-allowed; }
    #btn-stop { background: #fff; color: #8b3a2a; border: 1px solid #c8a09a; }
    #btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }
    .error-box { display: none; background: #f5ece9; border: 1px solid #c8a09a; border-radius: 6px; padding: 0.7rem 1rem; color: #8b3a2a; font-size: 0.9rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="card">
  <h1>Committee Decision Task</h1>
  <p class="subtitle">A short oral discussion task with an AI speaking partner</p>
  <div class="info-box">
    <strong>How it works:</strong> Click <em>Start Task</em>, allow microphone access, and speak when prompted. No typing needed.
  </div>
  <div class="status-area">
    <div class="orb" id="orb"></div>
    <div class="status-text" id="status-text">Ready</div>
  </div>
  <div class="transcript-box" id="transcript">The conversation will appear here…</div>
  <div class="error-box" id="error-box"></div>
  <div class="btn-row">
    <button id="btn-start">&#9658; Start Task</button>
    <button id="btn-stop" disabled>&#9632; Stop</button>
  </div>
</div>
<audio id="ai-audio" autoplay playsinline style="display:none"></audio>
<script>
var pc = null, dc = null, stream = null, triggered = false;

function setStatus(label, cls) {
  document.getElementById('status-text').textContent = label;
  document.getElementById('orb').className = 'orb ' + (cls || '');
}

function showError(msg) {
  setStatus('Error', 'error');
  var b = document.getElementById('error-box');
  b.style.display = 'block';
  b.textContent = msg;
}

function addMessage(who, text) {
  if (!text || !text.trim()) return;
  var box = document.getElementById('transcript');
  if (box.textContent.indexOf('appear here') !== -1) box.innerHTML = '';
  var turn = document.createElement('div'); turn.className = 'turn ' + who;
  var lbl = document.createElement('div'); lbl.className = 'who';
  lbl.textContent = who === 'ai' ? 'AI Partner' : 'You';
  var body = document.createElement('div'); body.textContent = text.trim();
  turn.appendChild(lbl); turn.appendChild(body);
  box.appendChild(turn); box.scrollTop = box.scrollHeight;
}

function sendTrigger() {
  if (triggered) return;
  if (!dc || dc.readyState !== 'open') return;
  triggered = true;
  dc.send(JSON.stringify({ type: 'response.create', response: { modalities: ['audio', 'text'] } }));
}

document.getElementById('btn-start').addEventListener('click', function() {
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('transcript').innerHTML = '';
  triggered = false;
  setStatus('Connecting...', 'connecting');

  fetch('/api/session', { method: 'POST' })
    .then(function(r) {
      if (!r.ok) throw new Error('Session error: ' + r.status);
      return r.json();
    })
    .then(function(session) {
      var token = session.client_secret && session.client_secret.value;
      if (!token) throw new Error('No token received');
      setStatus('Requesting microphone...', 'connecting');

      return navigator.mediaDevices.getUserMedia({ audio: true }).then(function(s) {
        stream = s;
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

        pc.ontrack = function(e) {
          if (e.streams && e.streams[0]) document.getElementById('ai-audio').srcObject = e.streams[0];
        };

        stream.getTracks().forEach(function(t) { pc.addTrack(t, stream); });

        dc = pc.createDataChannel('oai-events');
        var aiBuf = '', humanBuf = '';

        dc.onopen = function() {
          setStatus('Listening...', 'listening');
          sendTrigger();
        };

        dc.onmessage = function(e) {
          var msg; try { msg = JSON.parse(e.data); } catch(x) { return; }
          if (msg.type === 'response.created') { setStatus('AI is speaking...', 'speaking'); aiBuf = ''; }
          else if (msg.type === 'response.audio_transcript.delta' && msg.delta) { aiBuf += msg.delta; }
          else if (msg.type === 'response.audio_transcript.done') { addMessage('ai', msg.transcript || aiBuf); aiBuf = ''; setStatus('Listening...', 'listening'); }
          else if (msg.type === 'response.done') { if (aiBuf) { addMessage('ai', aiBuf); aiBuf = ''; } setStatus('Listening...', 'listening'); }
          else if (msg.type === 'input_audio_buffer.speech_started') { setStatus('You are speaking...', 'listening'); humanBuf = ''; }
          else if (msg.type === 'conversation.item.input_audio_transcription.completed') { addMessage('human', msg.transcript || humanBuf); humanBuf = ''; setStatus('AI is thinking...', 'speaking'); }
          else if (msg.type === 'error') { showError('API error: ' + (msg.error ? msg.error.message : 'unknown')); }
        };

        dc.onclose = function() { setStatus('Disconnected', ''); };

        return pc.createOffer().then(function(offer) {
          return pc.setLocalDescription(offer).then(function() {
            var model = session.model || 'gpt-4o-realtime-preview-2024-12-17';
            return fetch('https://api.openai.com/v1/realtime?model=' + encodeURIComponent(model), {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/sdp' },
              body: offer.sdp
            });
          });
        });
      });
    })
    .then(function(sdpRes) {
      if (!sdpRes.ok) throw new Error('SDP error: ' + sdpRes.status);
      return sdpRes.text();
    })
    .then(function(answer) {
      return pc.setRemoteDescription({ type: 'answer', sdp: answer });
    })
    .then(function() {
      setStatus('Connecting to AI...', 'connecting');
      var poll = setInterval(function() {
        if (!dc) { clearInterval(poll); return; }
        if (dc.readyState === 'open') { clearInterval(poll); setStatus('Listening...', 'listening'); sendTrigger(); }
        if (dc.readyState === 'closed') clearInterval(poll);
      }, 300);
    })
    .catch(function(err) {
      console.error(err);
      showError(err.message);
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      setStatus('Ready', '');
    });
});

document.getElementById('btn-stop').addEventListener('click', function() {
  if (dc) { try { dc.close(); } catch(e) {} dc = null; }
  if (pc) { try { pc.close(); } catch(e) {} pc = null; }
  if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
  document.getElementById('ai-audio').srcObject = null;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  setStatus('Ready', '');
});
</script>
</body>
</html>
